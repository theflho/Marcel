# À fusionner avec le compose existant de Hermes sur le VPS.
# Le backend n'écoute que sur 127.0.0.1 ; Tailscale Serve l'expose en HTTPS
# dans le tailnet uniquement. Hermes n'a aucun port publié.
services:
  marcel-api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - marcel-data:/data   # pièces jointes
    networks: [marcel-internal]
    restart: unless-stopped

  # hermes:
  #   ...configuration existante, sans section "ports"...
  #   networks: [marcel-internal]

  # Second profil Hermes, réservé aux vérifications de Marcel proactif : mêmes image et
  # fournisseur de modèle que "hermes", mais son propre HERMES_HOME (volume séparé) dont le
  # config.yaml vient de deploy/hermes-checks.config.yaml (outils qui agissent désactivés).
  # Puis dans .env : MARCEL_CHECK_HERMES_URL=http://hermes-checks:8642 et MARCEL_CHECK_HERMES_KEY.
  # hermes-checks:
  #   image: <même image que hermes>
  #   environment:
  #     HERMES_HOME: /opt/data
  #     API_SERVER_ENABLED: "true"
  #     API_SERVER_HOST: 0.0.0.0
  #     API_SERVER_KEY: <clé dédiée, openssl rand -hex 32>
  #   volumes:
  #     - hermes-checks-data:/opt/data
  #   networks: [marcel-internal]
  #   restart: unless-stopped

volumes:
  marcel-data:
  # hermes-checks-data:

networks:
  marcel-internal:
    driver: bridge
