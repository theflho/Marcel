# Compose de Marcel sur le VPS, à copier en backend/compose.yaml (c'est ce que lance deploy/update.sh).
# Hermes reste dans son propre compose (~/assistant) : Marcel rejoint son réseau assistant_default.
# hermes-checks : second Hermes réservé aux vérifications automatiques, outils qui agissent retirés
# (~/.hermes-checks/config.yaml, voir hermes-checks.config.yaml) et sans messagerie.
# llm-guard : installé par deploy/install-guard.sh (crée guard.env et rebranche Hermes dessus).
services:
  # Le seul accès au fournisseur du modèle : compte les tokens et coupe au-delà du budget du jour.
  llm-guard:
    build: .
    image: marcel-backend
    container_name: llm-guard
    command: ["uvicorn", "app.llm_guard:app", "--host", "0.0.0.0", "--port", "4000"]
    env_file: guard.env
    volumes:
      - guard-data:/data
    restart: unless-stopped

  marcel-api:
    build: .
    image: marcel-backend
    container_name: marcel-api
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - marcel-data:/data
    restart: unless-stopped

  hermes-checks:
    # Pinned (HERMES_IMAGE in .env, e.g. nousresearch/hermes-agent@sha256:…), same as the main
    # Hermes: no silent update on restart. Updating is a deliberate change of that line.
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: hermes-checks
    command: gateway run
    volumes:
      - /home/ubuntu/.hermes-checks:/opt/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  # Robot de lecture du planning RMA (deploy/install-rma.sh) : navigateur invisible, lecture seule,
  # seul à connaître les identifiants RMA (rma.env) ; il ne fait que remettre le planning à Marcel.
  rma:
    build: ./rma
    container_name: rma
    env_file: rma.env
    environment:
      TZ: Europe/Paris
      MARCEL_URL: http://marcel-api:8000
    volumes:
      - rma-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

networks:
  default:
    name: assistant_default
    external: true
volumes:
  marcel-data:
  guard-data:
  rma-data:
