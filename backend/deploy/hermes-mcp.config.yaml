# Outils de lecture de Marcel pour le Hermes PRINCIPAL (pas hermes-checks) : à ajouter au
# config.yaml de son HERMES_HOME, puis redémarrer Hermes et vérifier avec `hermes mcp list`
# (ou `hermes tools`). Les clés viennent de la doc Hermes Agent (MCP) et peuvent changer selon la
# version installée.
#
# Hermes et marcel-api sont sur le réseau Docker assistant_default : l'adresse est interne,
# rien n'est publié. La clé est MARCEL_MCP_TOKEN du .env de Marcel (pas MARCEL_TOKEN).
#
# Les outils de lecture (marcel_resume, marcel_planning, marcel_offres, marcel_robot,
# marcel_historique, marcel_reponse, marcel_objectifs, marcel_routines,
# marcel_chercher, marcel_bots, marcel_passages, marcel_idees, marcel_regles, marcel_boite, marcel_boite_lire : sa propre boîte mail) et ceux qui agissent : marcel_creer_objectif,
# marcel_creer_routine, marcel_lancer_routine, marcel_regler_bot, marcel_bot (les bots sur Telegram), marcel_journaux
# (journaux du serveur) et les outils de code marcel_code_* (voir README, « Marcel modifie son propre
# code »). Créer un objectif ou une routine suit les règles de l'app (Réglages › Règles) : « Demander »
# le fait proposer, « Bloqué » le refuse. Aucun ne supprime ni n'épingle. Les réponses passées tirées
# d'e-mails ou de pièces jointes ne sont jamais renvoyées. Les skills qui vont avec sont dans
# deploy/hermes-skills/ (copiées dans ~/.hermes/skills/marcel/ par update.sh).
mcp_servers:
  marcel:
    url: "http://marcel-api:8000/mcp"
    headers:
      Authorization: "Bearer <MARCEL_MCP_TOKEN>"
