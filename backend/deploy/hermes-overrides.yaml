# Les réglages de Hermes que Marcel peut changer lui-même (pull request fusionnée), fusionnés dans
# ~/.hermes/config.yaml par deploy/auto-update.sh, qui redémarre Hermes et remet l'ancien fichier
# s'il ne répond plus. On ajoute ou on change des clés, on n'en retire pas. Restent à
# l'utilisateur : model, providers et fournisseurs, gateway, et tout secret en clair (seul
# ${MARCEL_MCP_TOKEN} est remplacé, pour le serveur MCP « marcel »). Voir app/hermes_config.py.
mcp_servers:
  marcel:
    url: "http://127.0.0.1:8000/mcp"
    headers:
      Authorization: "Bearer ${MARCEL_MCP_TOKEN}"
# Les outils de Hermes quand il répond à l'app (son serveur d'API). Par défaut, Hermes y coupe
# clarify, text_to_speech, computer_use et kanban ; ici, tout ce que le terminal (cli) a, plus le
# kanban. Restent coupés : clarify (l'API n'a personne à qui poser la question : Marcel la pose
# dans sa réponse) et text_to_speech (le fichier son resterait sur le serveur : l'app lit les
# réponses elle-même). computer_use n'apparaît que si le serveur a un écran (cua-driver).
# Les profils des bots reçoivent la même liste (app/hermes_profiles.py).
platform_toolsets:
  api_server:
    - browser
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
# L'app comme plateforme de Hermes, à la façon de Telegram : le plugin « marcel »
# (deploy/hermes-plugins/marcel, installé par auto-update.sh) livre ce que Hermes envoie seul
# (tâches cron, send_message) dans la conversation du bot de chaque profil.
plugins:
  enabled:
    - marcel
