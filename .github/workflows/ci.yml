# Vérifications de chaque pull request et de main : le serveur (tests, Python) et l'app iPhone
# (compilée pour le simulateur, sans signature). Marcel ne fusionne une pull request que si tout
# est vert (marcel_code_fusionner lit ces résultats).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  serveur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pyflakes app tests
      - run: python -m pytest -q tests
      - run: for f in deploy/*.sh; do bash -n "$f"; done

  app:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compiler l'app (simulateur, sans signature)
        working-directory: Marcel
        run: |
          xcodebuild -project Marcel.xcodeproj -target Marcel -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          exit "${PIPESTATUS[0]}"
